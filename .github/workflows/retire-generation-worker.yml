name: Retire generation Worker

# One-off: deletes the retired AI generation Worker and its billing D1.
# Remove this workflow after it has run.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retire:
    runs-on: ubuntu-latest
    environment: Production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3a6b9f53daa83fc24242d05bc590a2ee
    steps:
      # Plain API calls: `wrangler delete` also lists KV namespaces, which this
      # token is not allowed to read.
      - name: Delete lexiro-worker
        run: |
          # 10007: already gone.
          body=$(curl -sS -X DELETE \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/lexiro-worker?force=true")
          echo "$body"
          echo "$body" | grep -qE '"success": ?true|"code": ?10007'
      - name: Delete lexiro-billing D1
        run: |
          curl --fail-with-body -sS -X DELETE \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/3f72fc33-ea88-45eb-8354-d6dc8b26b2ac"
