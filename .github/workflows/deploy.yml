name: Verify and deploy Worker
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      verify_cache:
        description: "Verify all three model routes with nine small paid cache probes"
        type: boolean
        default: false
permissions:
  contents: read

concurrency:
  group: lexiro-worker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: Production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Validate production configuration
        run: |
          for value in CLOUDFLARE_API_TOKEN FIREBASE_PROJECT_ID OPENAI_API_KEY ADMIN_EMAILS; do
            if [ -z "${!value}" ]; then
              echo "::error title=Missing production configuration::Set $value in the Production environment before deploying."
              exit 1
            fi
          done

      - name: Set Firebase project binding
        run: sed -i "s/replace-with-firebase-project-id/$FIREBASE_PROJECT_ID/" wrangler.toml

      - name: Verify provider WebSocket support
        run: node scripts/probe-websocket.mjs

      - name: Verify parallel prefix cache
        if: inputs.verify_cache || contains(github.event.head_commit.message, '[cache-probe]')
        run: |
          npm run build
          node scripts/probe-generation-cache.mjs

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote

      - name: Set Worker secrets
        run: |
          printf %s "$OPENAI_API_KEY" | npx wrangler secret put OPENAI_API_KEY
          printf %s "$ADMIN_EMAILS" | npx wrangler secret put ADMIN_EMAILS

      - name: Deploy Worker
        run: npx wrangler deploy

      - name: Verify production CORS
        run: |
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --request OPTIONS \
            --header 'Origin: https://lexiro.vercel.app' \
            --header 'Access-Control-Request-Method: GET' \
            https://lexiro-worker.tavric.workers.dev/me)
          test "$status" = 204
