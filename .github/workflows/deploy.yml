name: Verify and deploy lexiro

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: vercel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: ${{ steps.deployment.outputs.url }}
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      NEXT_PUBLIC_FIREBASE_APPCHECK_SITE_KEY: ${{ secrets.VITE_FIREBASE_APPCHECK_SITE_KEY }}
      NEXT_PUBLIC_FIREBASE_APPCHECK_ENABLED: ${{ secrets.VITE_FIREBASE_APPCHECK_ENABLED }}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Validate release credentials
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error title=Missing GitHub Secret::Add VERCEL_TOKEN in Settings > Secrets and variables > Actions > Production."
            exit 1
          fi
          if [ -z "$VERCEL_ORG_ID" ]; then
            echo "::error title=Missing GitHub Secret::Add VERCEL_ORG_ID in Settings > Secrets and variables > Actions > Production."
            exit 1
          fi
          if [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error title=Missing GitHub Secret::Add VERCEL_PROJECT_ID in Settings > Secrets and variables > Actions > Production."
            exit 1
          fi
          if [[ "$VERCEL_PROJECT_ID" != prj_* ]]; then
            echo "::error title=Invalid Vercel Project ID::VERCEL_PROJECT_ID must be the Vercel Project ID (usually starts with prj_), not the project name or URL."
            exit 1
          fi
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error title=Missing GitHub Secret::Add FIREBASE_SERVICE_ACCOUNT in Settings > Secrets and variables > Actions > Production."
            exit 1
          fi
          if [ -z "$FIREBASE_PROJECT_ID" ]; then
            echo "::error title=Missing GitHub Secret::Add VITE_FIREBASE_PROJECT_ID in Settings > Secrets and variables > Actions > Production."
            exit 1
          fi

      - name: Reset Vercel local state
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: rm -rf .vercel

      - name: Pull Vercel production settings
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: npx --yes vercel@58.9.4 pull --yes --environment=production --project "$VERCEL_PROJECT_ID" --token "$VERCEL_TOKEN"

      - name: Build Vercel prebuilt output
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: npx --yes vercel@58.9.4 build --yes --prod --project "$VERCEL_PROJECT_ID" --token "$VERCEL_TOKEN"

      - name: Authenticate Google Cloud for Firebase CLI
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Deploy Firestore Rules and indexes
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: npx --yes firebase-tools@15.25.1 deploy --only firestore:rules,firestore:indexes --project "$FIREBASE_PROJECT_ID" --non-interactive

      - name: Deploy prebuilt output to Vercel
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        id: deployment
        run: |
          url=$(npx --yes vercel@58.9.4 deploy --yes --prebuilt --prod --project "$VERCEL_PROJECT_ID" --token "$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "$url"
