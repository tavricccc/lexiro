name: Usage watch

# Checks today's use of the Workers Free daily quotas every hour. A failed run
# means a quota passed 70%; GitHub emails the owner about failed scheduled
# runs. Run it by hand for a report.
#
# Past 80% of the D1 read quota it also sets the agent_paused flag, which makes
# the Worker refuse MCP and access-link work (503) so app sync keeps the rest
# of the day; the first run below 80%, normally just after 00:00 UTC, clears it.
on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lexiro-agent-production
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3a6b9f53daa83fc24242d05bc590a2ee
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check today's usage
        id: usage
        continue-on-error: true
        run: node scripts/usage-check.mjs
      - name: Pause or resume Agent work
        if: steps.usage.outputs.d1_read_share != ''
        env:
          SHARE: ${{ steps.usage.outputs.d1_read_share }}
        run: |
          set -euo pipefail
          d1() { npx wrangler d1 execute AGENT_DB --remote --config wrangler.agent.toml --command "$1"; }
          if node -e 'process.exit(Number(process.argv[1]) >= 0.8 ? 0 : 1)' "$SHARE"; then
            d1 "INSERT INTO service_flags(name,updated_at) VALUES('agent_paused',$(date +%s%3N)) ON CONFLICT(name) DO NOTHING"
            echo "Agent work paused: D1 reads at $SHARE of the daily quota." >> "$GITHUB_STEP_SUMMARY"
          else
            d1 "DELETE FROM service_flags WHERE name='agent_paused'"
          fi
      - name: Fail when a quota passed 70%
        if: steps.usage.outcome == 'failure'
        run: exit 1
