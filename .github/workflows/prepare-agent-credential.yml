name: Prepare encrypted Agent credential

on:
  workflow_dispatch:
    inputs:
      wrapping_public_key:
        description: Base64 DER public key for the deployment operator
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Seal existing Firebase credential
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          WRAPPING_PUBLIC_KEY: ${{ inputs.wrapping_public_key }}
        run: node scripts/seal-agent-credential.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-agent-credential
          path: agent-credential-sealed.json
          retention-days: 1
