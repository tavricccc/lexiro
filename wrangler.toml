name = "lexiro-worker"
main = "src/index.ts"
compatibility_date = "2026-09-12"
account_id = "3a6b9f53daa83fc24242d05bc590a2ee"

[vars]
FIREBASE_PROJECT_ID = "replace-with-firebase-project-id"
# Complete comma-separated list. Add a development origin in .dev.vars only.
ALLOWED_ORIGIN = "https://lexiro.vercel.app"
OPENAI_BASE_URL = "https://api.openai.com/v1"

[[durable_objects.bindings]]
name = "GENERATIONS"
class_name = "GenerationRoom"

[[migrations]]
tag = "generation-room-v1"
new_sqlite_classes = ["GenerationRoom"]

[[d1_databases]]
binding = "DB"
database_name = "lexiro-billing"
database_id = "3f72fc33-ea88-45eb-8354-d6dc8b26b2ac"
migrations_dir = "migrations"

[triggers]
crons = ["0 0 * * *"]
